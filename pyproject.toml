[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soilsight"
version = "0.1.0"
description = "Software for SoilSight: drone-guided soil checks for rice fields"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "rasterio>=1.4", "pillow>=10", "pyodm>=1.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
soilsight = "soilsight.cli:main"

[tool.setuptools.packages.find]
include = ["soilsight*"]

[tool.setuptools.package-data]
"soilsight.sim" = ["expected/*.json"]
"soilsight.ingest" = ["sensors.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
