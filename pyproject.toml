[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soilsight"
version = "0.1.0"
description = "Software for SoilSight: drone-guided soil checks for rice fields"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
soilsight = "soilsight.cli:main"

[tool.setuptools.packages.find]
include = ["soilsight*"]

[tool.setuptools.package-data]
"soilsight.sim" = ["expected/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
